[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-future-prediction"
version = "0.2.0"
description = "Leakage-aware stock-return forecasting and backtesting research framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
data = [
  "yfinance>=0.2.65,<1",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["stock_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
