name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Run benchmark on committed AAPL sample
        run: |
          python -m stock_forecast.benchmark             --data Code/stock_data.csv             --output-dir /tmp/benchmark
          test -f /tmp/benchmark/leaderboard.csv
          test -f /tmp/benchmark/predictions.csv
